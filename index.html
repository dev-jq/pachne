<!DOCTYPE html>
<html lang="pl" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pachnę – kolekcja perfum</title>
<meta name="description" content="Pachnę – prywatna kolekcja perfum: ranking, oceny, koszt za ml, dziennik noszenia i podpowiedzi zapachów. Dane zostają w Twojej przeglądarce.">
<meta name="theme-color" content="#0e171d">
<meta property="og:title" content="Pachnę – kolekcja perfum">
<meta property="og:description" content="Ranking, oceny, koszt za ml, dziennik noszenia i podpowiedzi zapachów. Dane zostają w Twojej przeglądarce.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#eef3f5;--sf:#fff;--ink:#12202a;--mut:#5d7080;--ln:#d5e0e6;--ac:#0e7c7b;--acs:#d6f0ee;--gd:#b9801a;--gds:#fbefd2;--rd:#b4413a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#0e171d;--sf:#16232b;--ink:#e8f0f3;--mut:#8fa5b3;--ln:#273944;--ac:#38c0bd;--acs:#12393a;--gd:#e2a940;--gds:#3a2e12;--rd:#e8776f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:0 auto;padding:0 12px 150px}
h1,h2,.num{font-family:system-ui,sans-serif}
header{padding:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;margin:20px 0 8px}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;overflow-x:auto}
nav button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;font:600 14px inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chips.cl{max-height:68px;overflow:hidden}
.sep{flex:0 0 1px;height:22px;background:var(--ln);margin:3px 4px;align-self:center}
.more{display:block;margin:-2px 0 10px auto;background:none;border:1px solid var(--ac);border-radius:99px;color:var(--ac);font-weight:600;font-size:13px;padding:4px 12px;cursor:pointer}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
.pos{width:26px;text-align:center;color:var(--mut);font-weight:700}
.sc{min-width:76px;text-align:center}
.ppm{margin-top:6px;font:700 11px system-ui,sans-serif;padding:3px 7px;border-radius:8px;background:var(--ac);color:var(--sf);white-space:nowrap}
.num{font-size:28px;font-weight:800;line-height:1}.num small{font-size:13px;color:var(--mut);font-weight:500}
.top .num{color:var(--gd)}
.mid{flex:1;min-width:0}
.leg{scroll-margin-top:76px;margin:18px 0 8px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}.leg summary{cursor:pointer;font-weight:700;color:var(--ac)}.legi{margin-top:12px}.legi p{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--mut)}.cbadge{margin-top:5px;font:800 11px system-ui,sans-serif;padding:4px 8px;border-radius:8px;background:var(--gd);color:var(--sf);white-space:nowrap;box-shadow:0 0 0 2px color-mix(in srgb,var(--gd) 30%,transparent)}.note{margin-top:5px;font-size:12px;color:var(--mut);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.br{font-size:12px;color:var(--mut)}.nm{font-weight:700;font-size:16px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.t{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--acs);color:var(--ac)}
.t.s{background:var(--gds);color:var(--gd)}.t.w{background:#f3d9d6;color:var(--rd)}
:root[data-theme="dark"] .t.w{background:#3d1f1c}
.st-own{--c:light-dark(#1f8a4c,#4ccb81)}.st-wantbuy{--c:light-dark(#2f6fd0,#6aa3f5)}.st-wanttest{--c:light-dark(#2b9bd6,#6fc3f0)}.st-watch{--c:light-dark(#8a52c8,#b98af0)}.st-tested{--c:light-dark(#6b7a86,#9db0bd)}.st-had{--c:light-dark(#9a6b3f,#d09a62)}.st-again{--c:light-dark(#0e8f8f,#45cfcf)}.st-no{--c:light-dark(#c0443c,#f2807a)}.st-tryout{--c:light-dark(#d9822b,#f0a35e)}.st-comp{--c:light-dark(#c2185b,#f48fb1)}
.t[class*="st-"]{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px #0004;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px}
.kpi b{display:block;font:800 24px system-ui}.kpi span{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bar i{flex:0 0 38%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-style:normal}
.bar u{flex:1;height:14px;background:var(--ln);border-radius:7px;overflow:hidden;text-decoration:none;display:block}
.bar u s{display:block;height:100%;background:var(--ac);border-radius:7px}
.bar em{flex:0 0 52px;text-align:right;font-style:normal;color:var(--mut)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px}
.sg{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px}
.sg p{margin:4px 0 8px;color:var(--mut);font-size:13px}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-weight:600}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.d{color:var(--rd)}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,520px);background:var(--sf);color:var(--ink);max-height:92vh}
dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px;border-radius:9px;border:1px solid var(--ln);background:var(--bg)}
input:disabled,select:disabled{opacity:.45;cursor:not-allowed}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--mut);padding:30px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
</style></head><body>
<header><h1>Pachnę</h1><button class="btn" onclick="toggleTheme()" aria-label="Zmień motyw">◐</button></header>
<nav id="nav"></nav><main id="main"></main>
<button class="fab" onclick="edit()" aria-label="Dodaj zapach">+</button>
<dialog id="dlg"></dialog>
<script>
try{const th=localStorage.getItem('perf_theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}
const KEY='perf_v1';
const ST={own:'Posiadam',wantbuy:'Chcę kupić',wanttest:'Chcę testować',watch:'Mieć na uwadze',tested:'Testuję',tryout:'Wypróbowany w drogerii',again:'Miałem, chcę ponownie',no:'Miałem i nie chcę'};
const SRC=['Pełny flakon','Odlewka','Ubytek (grupa FB)','Zakup jako nowy','Magiczne Perfumy','Oryginalna próbka','Prezent'];
const OCC=['Codzienne','Codzienne premium','Eleganckie','Garniturowe','Uroczystość','Randka','Sportowe','Wiosna-Lato','Jesień-Zima','Całoroczne'];
const seed=()=>[];
const CONC=['EDC','EDT','EDP','Parfum','Extrait'];
let D=load(),view='rank',flt='all',tag='',cflt='',more={f:0},q='',sortBy='rating';
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const $=id=>document.getElementById(id);
const js=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ppm=x=>x.ml>0&&x.price>0?x.price/x.ml:null;
const fmt=n=>(Math.round(n*100)/100).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2});
function toggleTheme(){const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('perf_theme',n)}catch(e){}}
function nav(){const t=[['rank','Ranking'],['log','Dziennik'],['stats','Statystyki'],['sug','Sugestie']];
$('nav').innerHTML=t.map(a=>`<button class="${view===a[0]?'on':''}" onclick="view='${a[0]}';render()">${a[1]}</button>`).join('')}
function card(x,i){const r=x.rating;return `<div class="card ${r>=9?'top':''}" onclick="edit('${x.id}')"><div class="pos">${i<0?'·':i+1}</div>
<div class="mid"><div class="br">${esc(x.brand)}</div><div class="nm">${esc(x.name)} ${x.conc?`<span class="br">${esc(x.conc)}</span>`:''}${x.fav?' ✨':''}</div>
<div class="tags"><span class="t st-${x.status}">${ST[x.status]}</span>${x.type==='insp'||x.type==='clone'?`<span class="t s">${x.type==='clone'?'Klon':'Inspirowany'}${x.insp?' – '+esc(x.insp):''}</span>`:''}${x.source?`<span class="t s">${esc(x.source)}</span>`:''}${x.refill==='tak'?'<span class="t st-tested">Refill</span>':''}${(x.tags||[]).map(t=>`<span class="t">${esc(t)}</span>`).join('')}</div>${x.note?`<div class="note">📝 ${esc(x.note)}</div>`:''}</div>
<div class="sc num">${r===''||r==null?'–':r}<small>${r===''||r==null?'':'/10'}</small>${ppm(x)?`<div class="ppm">${fmt(ppm(x))} zł/ml</div>`:''}${x.comp>0?`<div class="cbadge">💌 Komplement${x.comp>1?' ×'+x.comp:''}</div>`:''}</div></div>`}
var legOpen=false;
const LEG=[['Eleganckie','Zapachy podkreślające klasę i zadbany wygląd. Do koszuli, eleganckiego stylu smart casual, restauracji, spotkań biznesowych i bardziej formalnych wyjść.'],['Garniturowe','Zapachy pasujące do garnituru, smokingu i formalnego dress code\'u. Na ważne spotkania, gale, bankiety i uroczyste okazje. Liczy się charakter zapachu, nie tylko jego moc.'],['Sportowe','Świeże, energetyczne i swobodne zapachy. Na spacer, rower, aktywny dzień, luźne spotkania i nieformalne wyjścia. Nie oznacza to automatycznie zapachu przeznaczonego do intensywnego treningu.'],['Randka','Zapachy budujące atrakcyjną, zmysłową lub intrygującą aurę. Na romantyczne spotkania, kolację we dwoje i wieczór z partnerką. Ważne są odbiór z bliska i odpowiednia intensywność.'],['Uroczystość','Zapachy na wyjątkowe wydarzenia: wesele, święta, rodzinne uroczystości, jubileusze, ważne spotkania i eleganckie przyjęcia.'],['Wiosna-Lato','Zapachy dobrze sprawdzające się w cieplejszej pogodzie. Często świeże, cytrusowe, wodne, zielone lub lekkie. Wysoka temperatura może wzmacniać projekcję, dlatego ważna jest również dawka.'],['Jesień-Zima','Zapachy często cieplejsze, głębsze i bardziej otulające: korzenne, drzewne, ambrowe, balsamiczne lub słodkie. Dobrze pasują do chłodu, choć nie każdy cięższy zapach jest odpowiedni na każdą okazję.'],['Całoroczne','Zapachy na różne pory roku i temperatury. Dobrze sprawdzają się w wielu sytuacjach bez konieczności czekania na konkretną porę roku. Nie oznacza to, że pasują do każdej okazji.']];
function legendBox(){return `<details id="legend" class="leg" ${legOpen?'open':''} ontoggle="legOpen=this.open"><summary>ⓘ Legenda okazji</summary>${LEG.map(a=>`<div class="legi"><span class="t">${esc(a[0])}</span><p>${esc(a[1])}</p></div>`).join('')}</details>`}
function openLegend(){legOpen=true;const d=$('legend');if(!d)return;d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}
const SORTS=[['rating','Ocena ↓'],['ppmd','Zł/ml ↓'],['ppma','Zł/ml ↑'],['name','Nazwa A–Z'],['comp','Komplementy ↓']];
const sq=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
const hay=x=>sq([x.brand,x.name,x.conc,x.insp,x.source,(x.tags||[]).join(' '),ST[x.status],x.blotter,x.skin,x.note,x.type==='insp'?'inspirowany':x.type==='clone'?'klon':''].join(' '));
function welcome(){return `<div class="box" style="margin-top:6px"><b style="font-size:17px">Witaj w Pachnę 👋</b><p style="margin:10px 0 4px;font-size:15px">Nie masz jeszcze zapachów na swojej liście. Dodaj jakiś :)</p><p class="br" style="margin:8px 0 12px;font-size:14px">Twoja prywatna kolekcja perfum: ranking z ocenami, statusy (posiadam, chcę kupić, testuję…), koszt za ml, dziennik noszenia, okazje i podpowiedzi zapachów dopasowane do Twoich ocen.</p><button class="btn p" onclick="edit()">+ Dodaj pierwszy zapach</button><p class="br" style="margin:12px 0 0">Masz kopię z wcześniejszej wersji? Wejdź w <b>Statystyki → Kopia zapasowa → Wczytaj z pliku</b>.</p></div>`}
function rankList(){
if(!D.length)return welcome();
let L=D.filter(x=>flt==='all'||x.status===flt||(flt==='want'&&(x.status==='wantbuy'||x.status==='wanttest'))||(flt==='fav'&&x.fav)||(flt==='comp'&&x.comp)||(flt==='insp'&&(x.type==='insp'||x.type==='clone'))).filter(x=>!tag||(x.tags||[]).includes(tag)).filter(x=>!cflt||x.conc===cflt);
const toks=sq(q).split(/\s+/).filter(Boolean);
if(toks.length)L=L.filter(x=>{const h=hay(x);return toks.every(t=>h.includes(t))});
const R=x=>x.rating===''||x.rating==null?-1:+x.rating,P=x=>ppm(x);
const srt={rating:(a,b)=>R(b)-R(a),ppmd:(a,b)=>(P(b)??-1)-(P(a)??-1)||R(b)-R(a),ppma:(a,b)=>(P(a)??1e9)-(P(b)??1e9)||R(b)-R(a),name:(a,b)=>(a.brand+' '+a.name).localeCompare(b.brand+' '+b.name,'pl'),comp:(a,b)=>(+b.comp||0)-(+a.comp||0)||R(b)-R(a)};
L.sort(srt[sortBy]||srt.rating);
const act=q.trim()||flt!=='all'||tag||cflt;
return `<p class="br" style="margin:2px 0 8px">${L.length} z ${D.length}${act?' • filtry aktywne':''}</p>`+(L.length?L.map((x,i)=>card(x,sortBy==='rating'?i:-1)).join(''):(q.trim()?`<div class="empty">Brak wyników dla „${esc(q.trim())}”. Zmień frazę lub wyczyść filtry.</div>`:'<div class="empty">Brak zapachów w tym filtrze. Dodaj nowy przyciskiem +.</div>'))}
function rank(){const all=[...new Set([...D.flatMap(x=>x.tags||[]),'Wiosna-Lato','Jesień-Zima'])].sort();
const concs=CONC.filter(c=>D.some(x=>x.conc===c));
const f=[['all','Wszystkie'],['fav','✨ Ulubione'],['comp','💌 Komplement'],['own','Posiadam'],['want','Chcę'],['tested','Testuję'],['tryout','Wypróbowany w drogerii'],['watch','Mieć na uwadze'],['again','Chcę ponownie'],['no','Nie chcę'],['insp','Inspirowane i klony']];
return `${D.length?`<button class="btn p" style="width:100%;margin:4px 0 6px" onclick="today('')">🎲 Czym dziś pachnieć?</button>`:''}${D.length<2?'':`<div style="display:flex;gap:8px;margin:6px 0 8px"><input id="q" type="search" placeholder="Szukaj zapachu, marki, nuty…" aria-label="Szukaj" value="${esc(q)}" oninput="q=this.value;$('rlist').innerHTML=rankList()" style="flex:1;min-width:0"><select id="sortBy" aria-label="Sortowanie" onchange="sortBy=this.value;render()" style="width:auto;max-width:46%">${SORTS.map(a=>`<option value="${a[0]}" ${sortBy===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div><div class="chips ${more.f?'':'cl'}" id="cf">${f.map(a=>`<span class="chip ${flt===a[0]?'on':''}" onclick="flt='${a[0]}';render()">${a[1]}</span>`).join('')}<span class="sep"></span>${concs.map(c=>`<span class="chip ${cflt===c?'on':''}" onclick="cflt=cflt==='${c}'?'':'${c}';render()">${c}</span>`).join('')}${concs.length?'<span class="sep"></span>':''}${all.map(t=>`<span class="chip ${tag===t?'on':''}" onclick="tag=tag==='${js(t)}'?'':'${js(t)}';render()">${esc(t)}</span>`).join('')}</div><div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-2px 0 10px">${more.f?'<button class="more" style="margin:0" onclick="openLegend()" aria-label="Legenda okazji" title="Legenda okazji">ⓘ</button>':''}<button class="more" id="mf" style="display:none;margin:0" onclick="more.f=!more.f;render()">${more.f?'Zwiń ▴':'Rozwiń ▾'}</button></div>`}
<div id="rlist">${rankList()}</div>${legendBox()}<p class="br" style="margin:14px 2px">🔒 Dane zapisują się tylko w tej przeglądarce, na tym urządzeniu – nic nie jest wysyłane na serwer. Rób kopię: Statystyki → Kopia zapasowa.</p>`}
function bars(rows,fmtv){const m=Math.max(...rows.map(r=>r[1]),1);return rows.length?rows.map(r=>`<div class="bar"><i>${esc(r[0])}</i><u><s style="width:${r[1]/m*100}%"></s></u><em>${fmtv?fmtv(r[1]):r[1]}</em></div>`).join(''):'<div class="br">Brak danych – uzupełnij cenę i pojemność.</div>'}
function count(arr){const o={};arr.forEach(k=>{if(k)o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function stats(){const rated=D.filter(x=>x.rating!==''&&x.rating!=null),own=D.filter(x=>x.status==='own'),sp=D.filter(x=>x.price>0&&x.status==='own');
const tot=sp.reduce((s,x)=>s+ +x.price,0),pp=D.filter(ppm).sort((a,b)=>ppm(b)-ppm(a)),avgp=pp.length?pp.reduce((s,x)=>s+ppm(x),0)/pp.length:0;
const avg=rated.length?rated.reduce((s,x)=>s+ +x.rating,0)/rated.length:0;
const bk={};rated.forEach(x=>{const k=Math.floor(x.rating);bk[k]=(bk[k]||0)+1});
return `<div class="grid"><div class="kpi"><b>${D.length}</b><span>zapachów w bazie</span></div><div class="kpi"><b>${own.length}</b><span>posiadam</span></div>
<div class="kpi"><b>${fmt(tot)} zł</b><span>wydane (posiadane z ceną)</span></div><div class="kpi"><b>${avgp?fmt(avgp):'–'}</b><span>śr. zł za ml</span></div>
<div class="kpi"><b>${fmt(avg)}</b><span>średnia ocena</span></div><div class="kpi"><b>${D.filter(x=>x.status==='wantbuy'||x.status==='wanttest').length}</b><span>na liście życzeń</span></div>
<div class="kpi"><b>${D.reduce((s,x)=>s+(+x.comp||0),0)}</b><span>💌 komplementy łącznie • zapachy: ${D.filter(x=>x.comp>0).length}</span></div><div class="kpi"><b>${D.filter(x=>x.fav).length}</b><span>✨ ulubione</span></div></div>
<h2>Rozkład ocen</h2><div class="box">${bars(Object.entries(bk).sort((a,b)=>b[0]-a[0]).map(a=>[a[0]+'–'+(+a[0]+.5)+'+',a[1]]))}</div>
<h2>Koszt za mililitr</h2><div class="box">${bars(pp.map(x=>[x.name,ppm(x)]),v=>fmt(v)+' zł')}</div>

const x=pool[Math.floor(Math.random()*pool.length)];window.lastPick=x?x.id:null;
const match=x&&((x.tags||[]).includes(k)||(x.tags||[]).includes('Całoroczne'));
$('dlg').innerHTML=`<h2 style="margin-top:0">Czym dziś pachnieć?</h2><div class="chips">${['Codzienne','Eleganckie','Uroczystość','Randka','Sportowe'].map(o=>`<span class="chip ${o===occ?'on':''}" onclick="today('${o}')">${o}</span>`).join('')}</div>${x?`<div class="sg"><div class="br">${esc(x.brand)}</div><div class="nm">${esc(x.name)} ${esc(x.conc)}</div><p>${esc(ST[x.status])}${match?' • pasuje do: '+esc(k):''}${x.rating!==''&&x.rating!=null?' • ocena '+x.rating+'/10':''}</p></div>${F.length<2?'<p class="br">Do wyboru jest tylko jeden zapach. Zmień status innych na „Posiadam” lub „Testuję”, żeby losowanie miało z czego wybierać.</p>':''}`:'<div class="empty">Dodaj zapachy ze statusem Posiadam lub Testuję.</div>'}<div class="foot"><button class="btn p" onclick="today('${occ||''}')">Losuj ponownie</button><button class="btn" onclick="$('dlg').close()">Zamknij</button></div>`;
if(!$('dlg').open)$('dlg').showModal()}
function load2(k){try{const s=localStorage.getItem(k);if(s)return JSON.parse(s)}catch(e){}return[]}
function saveWear(){try{localStorage.setItem('perf_wear',JSON.stringify(window.WEAR))}catch(e){}}
function addWear(){const pid=$('w_pid').value;if(!pid)return;window.WEAR.push({id:'w'+Date.now(),pid,date:$('w_date').value});saveWear();render()}
function delWear(id){window.WEAR=window.WEAR.filter(w=>w.id!==id);saveWear();render()}
function wearLog(){const L=(window.WEAR=window.WEAR||load2('perf_wear'));const items=D.filter(x=>x.status==='own'||x.status==='tested');
const rows=[...L].sort((a,b)=>b.date.localeCompare(a.date));
const counts=count(L.map(w=>{const it=D.find(x=>x.id===w.pid);return it?it.brand+' '+it.name:null}));
const td=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
return `<div class="box"><label style="margin-top:0">Czym dziś pachniałeś?</label><select id="w_pid">${items.length?items.map(x=>`<option value="${x.id}">${esc(x.brand)} ${esc(x.name)}</option>`).join(''):'<option value="">brak – dodaj zapach ze statusem Posiadam lub Testuję</option>'}</select>
<label>Data</label><input id="w_date" type="date" value="${td}">
<button class="btn p" style="margin-top:10px" onclick="addWear()">Zapisz noszenie</button></div>
<h2>Najczęściej noszone</h2><div class="box">${bars(counts)}</div>
<h2>Historia</h2>${rows.length?rows.map(w=>{const it=D.find(x=>x.id===w.pid);return `<div class="card" style="cursor:default"><div class="mid"><div class="br">${esc(w.date)}</div><div class="nm">${it?esc(it.brand)+' '+esc(it.name):'(usunięty zapach)'}</div></div><button class="btn d" onclick="delWear('${w.id}')" aria-label="Usuń wpis">×</button></div>`}).join(''):'<div class="empty">Jeszcze nic nie zapisane. Dodaj powyżej, czym dziś pachniałeś.</div>'}`}
function saveItem(id,isNew){const g=k=>$('f_'+k).value.trim();
const o={id,brand:g('brand'),name:g('name'),conc:g('conc'),rating:g('rating')===''?'':+g('rating'),status:g('status'),source:NOSRC.includes(g('status'))?'':g('source'),ml:NOSRC.includes(g('status'))||g('ml')===''?'':+g('ml'),price:NOSRC.includes(g('status'))||g('price')===''?'':+g('price'),dur:g('dur'),proj:g('proj'),tags:g('tags').split(',').map(s=>s.trim()).filter(Boolean),blotter:g('blotter'),skin:g('skin'),note:g('note'),fav:$('f_fav').checked?1:0,comp:Math.max(0,Math.floor(+$('f_comp').value||0)),type:g('type'),insp:g('insp'),refill:g('refill'),fprice:g('fprice')===''?'':+g('fprice'),fml:g('fml')===''?'':+g('fml')};
if(!o.name){$('f_name').focus();return}
if(isNew)D.push(o);else D=D.map(a=>a.id===id?o:a);save();$('dlg').close();render()}
function delItem(id){const x=D.find(a=>a.id===id);if(!x)return;
$('dlg').innerHTML=`<h2 style="margin-top:0">Usunąć zapach?</h2><div class="sg"><div class="br">${esc(x.brand)}</div><div class="nm">${esc(x.name)} ${esc(x.conc)}</div><p>Zapach zniknie z rankingu i statystyk. Wpisy w dzienniku zostaną, ale bez nazwy.</p></div><div class="foot"><button class="btn d" onclick="doDel('${id}')">Usuń</button><button class="btn" onclick="edit('${id}')">Anuluj</button></div>`}
function doDel(id){D=D.filter(a=>a.id!==id);save();$('dlg').close();render()}
function askReset(){$('dlg').innerHTML=`<h2 style="margin-top:0">Usunąć wszystkie dane?</h2><div class="sg"><p>Wszystkie zapachy, dziennik noszenia i ukryte sugestie zostaną usunięte z tej przeglądarki. Zrób najpierw kopię do pliku, jeśli chcesz mieć możliwość powrotu.</p></div><div class="foot"><button class="btn d" onclick="resetAll()">Usuń wszystko</button><button class="btn" onclick="$('dlg').close()">Anuluj</button></div>`;$('dlg').showModal()}
function resetAll(){D=[];window.WEAR=[];window.DIS=[];save();saveWear();saveDis();$('dlg').close();render()}
let pend=null,bmsg='',fbTxt='';
function fstamp(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16).replace('T','_').replace(':','-')}
function stamp(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
function backupData(){return{app:'moje-zapachy',version:1,exportedAt:new Date().toISOString(),perfumes:D,wear:window.WEAR||load2('perf_wear'),dismissed:window.DIS||[]}}
function exportFile(){const txt=JSON.stringify(backupData(),null,1);
try{const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='pachne-backup-'+fstamp()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
try{localStorage.setItem('perf_lastbackup',stamp())}catch(e){}bmsg='Kopia zapisana – sprawdź folder Pobrane.'}catch(e){fbTxt=txt;bmsg='Nie udało się zapisać pliku. Skopiuj kopię jako tekst z pola poniżej i zachowaj ją w notatce.'}
render()}
function showTxt(){fbTxt=JSON.stringify(backupData(),null,1);render()}
const num=v=>{if(v===''||v==null)return '';const n=+v;return isFinite(n)?n:''};
const sid=v=>String(v==null?'':v).replace(/[^\w-]/g,'').slice(0,40);
const cs=v=>String(v==null?'':v).slice(0,2000);
function cleanItem(x,i){let st=x.status==='had'?'no':x.status==='want'?'wanttest':x.status;if(!ST[st])st='tested';
return{id:sid(x.id)||'i'+Date.now()+'_'+i,brand:cs(x.brand),name:cs(x.name),conc:cs(x.conc),rating:num(x.rating),status:st,source:cs(x.source),ml:num(x.ml),price:num(x.price),dur:cs(x.dur),proj:cs(x.proj),tags:(Array.isArray(x.tags)?x.tags:[]).map(cs).filter(Boolean),blotter:cs(x.blotter),skin:cs(x.skin),note:cs(x.note),fav:x.fav?1:0,comp:Math.max(0,Math.floor(+x.comp||0)),type:['orig','insp','clone'].includes(x.type)?x.type:'orig',insp:cs(x.insp),refill:['tak','nie'].includes(x.refill)?x.refill:'',fprice:num(x.fprice),fml:num(x.fml)}}
function parseBackup(t){const j=JSON.parse(t);const p=Array.isArray(j)?j:(j&&j.perfumes);if(!Array.isArray(p)||p.some(x=>!x||typeof x!=='object'||!x.name))throw 0;
const seen=new Set(),P=p.map(cleanItem).map(x=>{while(seen.has(x.id))x.id+='x';seen.add(x.id);return x});
const wear=(j&&Array.isArray(j.wear))?j.wear.filter(w=>w&&/^\d{4}-\d{2}-\d{2}$/.test(String(w.date))).map((w,i)=>({id:sid(w.id)||'w'+Date.now()+'_'+i,pid:sid(w.pid),date:String(w.date)})):null;
const dis=(j&&Array.isArray(j.dismissed))?j.dismissed.filter(d=>typeof d==='string').map(cs):null;
return{perfumes:P,wear,dis,at:(j&&typeof j.exportedAt==='string')?j.exportedAt.slice(0,30):''}}
function loadFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{pend=parseBackup(String(r.result));bmsg=''}catch(e){pend=null;bmsg='To nie wygląda na plik kopii zapasowej.'}render()};r.readAsText(f)}
function pasteImport(){const t=$('exp')?$('exp').value:'';try{pend=parseBackup(t);bmsg=''}catch(e){pend=null;bmsg='Niepoprawny tekst kopii.'}render()}
function applyImport(){if(!pend)return;D=pend.perfumes;save();if(pend.wear){window.WEAR=pend.wear;saveWear()}if(pend.dis){window.DIS=pend.dis;saveDis()}pend=null;bmsg='Dane przywrócone.';render()}
function backupBox(){let last=null;try{last=localStorage.getItem('perf_lastbackup')}catch(e){}
const wn=(window.WEAR||load2('perf_wear')).length;
return `<h2>Kopia zapasowa</h2><div class="box"><p class="br" style="margin:0 0 8px">W kopii: ${D.length} zapachów i ${wn} wpisów dziennika (oceny, ceny, notatki, statusy). Dane są tylko w tej przeglądarce – czyszczenie danych witryny, tryb prywatny lub inne urządzenie oznaczają start od zera, więc rób kopie. Ostatnia kopia: <b>${last?esc(last):'jeszcze nie robiono'}</b></p>
<div class="foot" style="margin:0 0 8px"><button class="btn p" onclick="exportFile()">Zapisz kopię do pliku</button><label class="btn" style="margin:0;display:inline-block;color:var(--ink);font-size:15px">Wczytaj z pliku<input type="file" accept=".json,application/json" style="display:none" onchange="loadFile(this)"></label></div>
${bmsg?`<p class="br" style="margin:0 0 8px">${esc(bmsg)}</p>`:''}
${pend?`<div class="sg"><b>Przywrócić z pliku?</b><p>Plik zawiera ${pend.perfumes.length} zapachów${pend.wear?' i '+pend.wear.length+' wpisów dziennika':''}${pend.at?' (kopia z '+esc(pend.at.slice(0,10))+')':''}. Obecne dane zostaną zastąpione.</p><button class="btn p" onclick="applyImport()">Przywróć</button> <button class="btn" onclick="pend=null;render()">Anuluj</button></div>`:''}
<details ${fbTxt?'open':''}><summary class="br" style="cursor:pointer">Opcje zaawansowane</summary><div class="foot"><button class="btn" onclick="showTxt()">Pokaż kopię jako tekst</button><button class="btn" onclick="pasteImport()">Wczytaj wklejony tekst</button><button class="btn d" onclick="askReset()">Usuń wszystkie dane</button></div><textarea id="exp" rows="6" placeholder="Wklej tu kopię JSON" style="margin-top:8px">${esc(fbTxt)}</textarea></details></div>`}
function fitChips(){[['f',more.f]].forEach(([k,o])=>{const el=$('c'+k),b=$('m'+k);if(!el||!b)return;b.style.display=(o||el.scrollHeight>el.clientHeight+2)?'block':'none'})}
function render(){nav();$('main').innerHTML=(view==='rank'?rank():view==='log'?wearLog():view==='stats'?stats():sug())+(view==='stats'?backupBox():'');
fitChips();
}
render();
</script></body></html>
